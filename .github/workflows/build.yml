name: Build iOS IPA

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '16.0'

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Generate Xcode Project
      run: xcodegen generate

    - name: Build IPA
      run: |
        xcodebuild -project MxTunnelPro.xcodeproj \
          -scheme MxTunnelPro \
          -configuration Release \
          -sdk iphoneos \
          -archivePath build/MxTunnelPro.xcarchive \
          archive

        xcodebuild -exportArchive \
          -archivePath build/MxTunnelPro.xcarchive \
          -exportOptionsPlist ExportOptions.plist \
          -exportPath build/output

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MxTunnelPro-IPA
        path: build/output/*.ipa
        retention-days: 30
