name: MxTunnelPro
options:
  bundleIdPrefix: com.mxtunnel
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  MxTunnelPro:
    type: application
    platform: iOS
    sources:
      - MxTunnelPro
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mxtunnel.pro
        INFOPLIST_FILE: MxTunnelPro/Info.plist
        CODE_SIGN_ENTITLEMENTS: MxTunnelPro/MxTunnelPro.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
    entitlements:
      path: MxTunnelPro/MxTunnelPro.entitlements
    dependencies:
      - target: PacketTunnel
        embed: true

  PacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - PacketTunnel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mxtunnel.pro.PacketTunnel
        INFOPLIST_FILE: PacketTunnel/Info.plist
        CODE_SIGN_ENTITLEMENTS: PacketTunnel/PacketTunnel.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
    entitlements:
      path: PacketTunnel/PacketTunnel.entitlements
